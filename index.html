<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guyler's HomeScreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #07182A; font-family: system-ui, sans-serif; }
    .site-menu {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: #0A2037;
      border-bottom: 1px solid rgba(190,214,235,.18);
      box-shadow: 0 4px 16px rgba(0,0,0,.28);
      font-family: "Swanky and Moo Moo", cursive;
    }
    .site-menu a {
      padding: 8px 17px;
      border-radius: 999px;
      color: #EAF2F8;
      text-decoration: none;
      font-size: 1.35rem;
      line-height: 1;
    }
    .site-menu a:hover,
    .site-menu a:focus-visible {
      background: #143754;
      color: #FFAD62;
    }
    .site-menu a:focus-visible { outline: 3px solid rgba(63,227,109,.55); outline-offset: 2px; }
    .site-menu a[aria-current="page"] {
      background: #3FE36D;
      color: #07182A;
    }
    .page-frame {
      width: 100%;
      height: calc(100% - 62px);
      border: 0;
      display: block;
      background: #07182A;
    }
    @media (max-width: 480px) {
      .site-menu { height: 56px; gap: 4px; padding: 7px 8px; }
      .site-menu a { padding: 7px 12px; font-size: 1.18rem; }
      .page-frame { height: calc(100% - 56px); }
    }
  </style>
</head>
<body>
  <nav class="site-menu" aria-label="Site navigation">
    <a href="/HomeScreen/" aria-current="page">Home</a>
    <a href="/HomeScreen/health/">Health</a>
    <a href="/HomeScreen/learn/">Learn</a>
  </nav>

  <iframe
    class="page-frame"
    src="home-content.html"
    title="HomeScreen home page"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <script src="/HomeScreen/assets/home-dark-theme.js"></script>
  <script src="/HomeScreen/assets/calendar-3day.js"></script>
  <script src="/HomeScreen/assets/home-weight-chart.js"></script>
</body>
</html>
