<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guyler's HomeScreen</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #20282d; font-family: system-ui, sans-serif; }
    .site-menu {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: #20282d;
      border-bottom: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 4px 14px rgba(0,0,0,.24);
    }
    .site-menu a {
      padding: 10px 17px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      line-height: 1;
    }
    .site-menu a:hover,
    .site-menu a:focus-visible { background: rgba(255,255,255,.14); }
    .site-menu a[aria-current="page"] { background: #9c6b3f; }
    .page-frame { width: 100%; height: calc(100% - 62px); border: 0; display: block; background: #e9e9e5; }
    @media (max-width: 480px) {
      .site-menu { height: 56px; gap: 4px; padding: 7px 8px; }
      .site-menu a { padding: 9px 12px; font-size: 14px; }
      .page-frame { height: calc(100% - 56px); }
    }
  </style>
</head>
<body>
  <nav class="site-menu" aria-label="Site navigation">
    <a href="/HomeScreen/" aria-current="page">Home</a>
    <a href="/HomeScreen/health/">Health</a>
    <a href="/HomeScreen/learn/">Learn</a>
  </nav>

  <iframe
    class="page-frame"
    src="home-content.html"
    title="HomeScreen home page"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <script>
    const homeFrame = document.querySelector('.page-frame');
    const isAndroid = /Android/i.test(navigator.userAgent);

    function buildAndroidIntent(webUrl, packageName) {
      const url = new URL(webUrl);
      const target = `${url.host}${url.pathname}${url.search}${url.hash}`;
      return `intent://${target}#Intent;scheme=${url.protocol.replace(':', '')};package=${packageName};S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
    }

    function enableAppFirst(link, packageName) {
      if (!link || !packageName || link.dataset.appFirst === 'true') return;

      link.dataset.appFirst = 'true';
      const webUrl = link.href;

      link.addEventListener('click', event => {
        if (!isAndroid) return;

        event.preventDefault();
        window.location.href = buildAndroidIntent(webUrl, packageName);
      });
    }

    function faviconUrl(webUrl) {
      return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(webUrl)}&sz=64`;
    }

    function applyIcon(documentRef, link, config) {
      const fallback = documentRef.createElement('span');
      fallback.className = 'quick-link-fallback';
      fallback.textContent = config.fallback;
      fallback.setAttribute('aria-hidden', 'true');

      const icon = documentRef.createElement('img');
      icon.src = faviconUrl(config.iconUrl || config.href || link.href);
      icon.alt = '';
      icon.loading = 'lazy';
      icon.referrerPolicy = 'no-referrer';
      icon.addEventListener('error', () => icon.replaceWith(fallback), { once: true });

      link.replaceChildren(icon);
    }

    function configureQuickLink(documentRef, quickLinks, config) {
      let link = config.existingTitle
        ? quickLinks.querySelector(`a[title="${config.existingTitle}"]`)
        : documentRef.getElementById(config.id);

      if (!link) {
        link = documentRef.createElement('a');
        link.id = config.id;
        link.className = 'quick-link';
        quickLinks.appendChild(link);
      }

      link.href = config.href;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = config.title;
      link.setAttribute('aria-label', config.ariaLabel || `Open ${config.title}`);
      link.dataset.sortName = config.title;

      applyIcon(documentRef, link, config);

      if (config.packageName) {
        enableAppFirst(link, config.packageName);
      }
    }

    function alphabetiseQuickLinks(quickLinks) {
      const links = [...quickLinks.querySelectorAll('a.quick-link')];
      links.sort((a, b) => {
        const first = a.dataset.sortName || a.title || '';
        const second = b.dataset.sortName || b.title || '';
        return first.localeCompare(second, 'en-GB', { sensitivity: 'base' });
      });
      links.forEach(link => quickLinks.appendChild(link));
    }

    homeFrame.addEventListener('load', () => {
      try {
        const documentRef = homeFrame.contentDocument;
        const quickLinks = documentRef?.querySelector('.quick-links');
        if (!quickLinks) return;

        const iconStyle = documentRef.createElement('style');
        iconStyle.textContent = `
          .quick-link img {
            width: 29px;
            height: 29px;
            object-fit: contain;
            border-radius: 6px;
          }
          .quick-link-fallback {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 29px;
            height: 29px;
            border-radius: 7px;
            background: #20282d;
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 12px;
            font-weight: 800;
            line-height: 1;
          }
        `;
        documentRef.head.appendChild(iconStyle);

        const links = [
          {
            existingTitle: 'AccuWeather',
            title: 'AccuWeather',
            href: 'https://www.accuweather.com/',
            packageName: 'com.accuweather.android',
            fallback: '☀'
          },
          {
            id: 'altcodes-quick-link',
            title: 'Alt Codes',
            href: 'https://www.alt-codes.net/',
            fallback: 'Alt'
          },
          {
            id: 'bible-quick-link',
            title: 'Bible.com',
            href: 'https://www.bible.com/',
            packageName: 'com.sirma.mobile.bible.android',
            fallback: '✝'
          },
          {
            existingTitle: 'CalendarBridge',
            title: 'CalendarBridge',
            href: 'https://app.calendarbridge.com/dashboard',
            fallback: 'CB'
          },
          {
            existingTitle: 'Calendly',
            title: 'Calendly',
            href: 'https://calendly.com/app/scheduling/meeting_types/user/me',
            fallback: 'C'
          },
          {
            id: 'compass-quick-link',
            title: 'Compass',
            href: 'https://leenmillsprimary-uk.compass.education/',
            packageName: 'com.jdlf.compass',
            fallback: '🧭'
          },
          {
            id: 'disneyplus-quick-link',
            title: 'Disney+',
            href: 'https://www.disneyplus.com/',
            packageName: 'com.disney.disneyplus',
            fallback: 'D+'
          },
          {
            id: 'eggtimer-quick-link',
            title: 'E.ggTimer',
            href: 'https://e.ggtimer.com/',
            fallback: '🥚'
          },
          {
            id: 'franco-specialty-coffee-quick-link',
            title: 'Franco Specialty Coffee',
            href: 'https://www.francospecialty.coffee/',
            fallback: '☕'
          },
          {
            id: 'gmail-quick-link',
            title: 'Gmail',
            href: 'https://mail.google.com/mail/u/0/',
            packageName: 'com.google.android.gm',
            fallback: 'G'
          },
          {
            existingTitle: 'Google Calendar',
            title: 'Google Calendar',
            href: 'https://calendar.google.com/calendar/u/0/r',
            packageName: 'com.google.android.calendar',
            fallback: '31'
          },
          {
            id: 'heinnie-haynes-quick-link',
            title: 'Heinnie Haynes',
            href: 'https://heinnie.com/',
            fallback: 'HH'
          },
          {
            id: 'myfitnesspal-quick-link',
            title: 'MyFitnessPal',
            href: 'https://www.myfitnesspal.com/',
            packageName: 'com.myfitnesspal.android',
            fallback: 'MFP'
          },
          {
            id: 'nehemiah-quick-link',
            title: 'Nehemiah',
            href: 'https://chatgpt.com/g/g-6a6f2147a4b48191978025f950045a49-nehemiah',
            iconUrl: 'https://chatgpt.com/',
            packageName: 'com.openai.chatgpt',
            fallback: 'N',
            ariaLabel: 'Open Nehemiah in ChatGPT'
          },
          {
            id: 'netflix-quick-link',
            title: 'Netflix',
            href: 'https://www.netflix.com/',
            packageName: 'com.netflix.mediaclient',
            fallback: 'N'
          },
          {
            id: 'outlook-quick-link',
            title: 'Outlook',
            href: 'https://outlook.office.com/mail/',
            packageName: 'com.microsoft.office.outlook',
            fallback: 'O'
          },
          {
            existingTitle: 'Spotify',
            title: 'Spotify',
            href: 'https://open.spotify.com/',
            packageName: 'com.spotify.music',
            fallback: '♪'
          },
          {
            id: 'teams-quick-link',
            title: 'Teams',
            href: 'https://teams.microsoft.com/',
            packageName: 'com.microsoft.teams',
            fallback: 'T'
          },
          {
            id: 'whatsapp-quick-link',
            title: 'WhatsApp',
            href: 'https://web.whatsapp.com/',
            packageName: 'com.whatsapp',
            fallback: 'WA'
          },
          {
            id: 'youtube-quick-link',
            title: 'YouTube',
            href: 'https://www.youtube.com/',
            packageName: 'com.google.android.youtube',
            fallback: '▶'
          }
        ];

        links.forEach(config => configureQuickLink(documentRef, quickLinks, config));
        alphabetiseQuickLinks(quickLinks);
      } catch (error) {
        console.warn('Unable to enhance HomeScreen quick links:', error);
      }
    });
  </script>
</body>
</html>
