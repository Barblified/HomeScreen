<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guyler's HomeScreen</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #20282d; font-family: system-ui, sans-serif; }
    .site-menu {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: #20282d;
      border-bottom: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 4px 14px rgba(0,0,0,.24);
    }
    .site-menu a {
      padding: 10px 17px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      line-height: 1;
    }
    .site-menu a:hover,
    .site-menu a:focus-visible { background: rgba(255,255,255,.14); }
    .site-menu a[aria-current="page"] { background: #9c6b3f; }
    .page-frame { width: 100%; height: calc(100% - 62px); border: 0; display: block; background: #e9e9e5; }
    @media (max-width: 480px) {
      .site-menu { height: 56px; gap: 4px; padding: 7px 8px; }
      .site-menu a { padding: 9px 12px; font-size: 14px; }
      .page-frame { height: calc(100% - 56px); }
    }
  </style>
</head>
<body>
  <nav class="site-menu" aria-label="Site navigation">
    <a href="/HomeScreen/" aria-current="page">Home</a>
    <a href="/HomeScreen/health/">Health</a>
    <a href="/HomeScreen/learn/">Learn</a>
  </nav>

  <iframe
    class="page-frame"
    src="home-content.html"
    title="HomeScreen home page"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <script>
    const homeFrame = document.querySelector('.page-frame');
    const isAndroid = /Android/i.test(navigator.userAgent);

    function buildAndroidIntent(webUrl, packageName) {
      const url = new URL(webUrl);
      const target = `${url.host}${url.pathname}${url.search}${url.hash}`;
      return `intent://${target}#Intent;scheme=${url.protocol.replace(':', '')};package=${packageName};S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
    }

    function enableAppFirst(link, packageName) {
      if (!link || !packageName || link.dataset.appFirst === 'true') return;

      link.dataset.appFirst = 'true';
      const webUrl = link.href;

      link.addEventListener('click', event => {
        if (!isAndroid) return;

        event.preventDefault();
        window.location.href = buildAndroidIntent(webUrl, packageName);
      });
    }

    function addQuickLink(documentRef, quickLinks, config) {
      let link = documentRef.getElementById(config.id);

      if (!link) {
        link = documentRef.createElement('a');
        link.id = config.id;
        link.className = 'quick-link';
        link.href = config.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', config.ariaLabel || `Open ${config.title}`);
        link.title = config.title;
        link.innerHTML = `
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle cx="16" cy="16" r="14" fill="${config.background}"/>
            <text x="16" y="20.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="${config.fontSize || 11}" font-weight="700" fill="${config.foreground || '#fff'}">${config.glyph}</text>
          </svg>`;
        quickLinks.appendChild(link);
      }

      if (config.packageName) {
        enableAppFirst(link, config.packageName);
      }
    }

    homeFrame.addEventListener('load', () => {
      try {
        const documentRef = homeFrame.contentDocument;
        const quickLinks = documentRef?.querySelector('.quick-links');
        if (!quickLinks) return;

        enableAppFirst(documentRef.querySelector('a[title="Google Calendar"]'), 'com.google.android.calendar');
        enableAppFirst(documentRef.querySelector('a[title="Spotify"]'), 'com.spotify.music');
        enableAppFirst(documentRef.querySelector('a[title="AccuWeather"]'), 'com.accuweather.android');

        const links = [
          {
            id: 'nehemiah-quick-link',
            title: 'Nehemiah',
            href: 'https://chatgpt.com/g/g-6a6f2147a4b48191978025f950045a49-nehemiah',
            packageName: 'com.openai.chatgpt',
            background: '#20282d',
            glyph: 'N',
            fontSize: 14,
            ariaLabel: 'Open Nehemiah in ChatGPT'
          },
          {
            id: 'myfitnesspal-quick-link',
            title: 'MyFitnessPal',
            href: 'https://www.myfitnesspal.com/',
            packageName: 'com.myfitnesspal.android',
            background: '#0066ee',
            glyph: 'MFP',
            fontSize: 8
          },
          {
            id: 'whatsapp-quick-link',
            title: 'WhatsApp',
            href: 'https://web.whatsapp.com/',
            packageName: 'com.whatsapp',
            background: '#25d366',
            glyph: 'WA',
            fontSize: 9
          },
          {
            id: 'teams-quick-link',
            title: 'Microsoft Teams',
            href: 'https://teams.microsoft.com/',
            packageName: 'com.microsoft.teams',
            background: '#6264a7',
            glyph: 'T',
            fontSize: 14
          },
          {
            id: 'outlook-quick-link',
            title: 'Outlook',
            href: 'https://outlook.office.com/mail/',
            packageName: 'com.microsoft.office.outlook',
            background: '#0078d4',
            glyph: 'O',
            fontSize: 14
          },
          {
            id: 'gmail-quick-link',
            title: 'Gmail',
            href: 'https://mail.google.com/mail/u/0/',
            packageName: 'com.google.android.gm',
            background: '#ea4335',
            glyph: 'G',
            fontSize: 14
          },
          {
            id: 'bible-quick-link',
            title: 'Bible.com',
            href: 'https://www.bible.com/',
            packageName: 'com.sirma.mobile.bible.android',
            background: '#7a4b2a',
            glyph: 'B',
            fontSize: 14
          },
          {
            id: 'eggtimer-quick-link',
            title: 'E.ggTimer',
            href: 'https://e.ggtimer.com/',
            background: '#f2b134',
            foreground: '#20282d',
            glyph: 'EGG',
            fontSize: 7
          },
          {
            id: 'altcodes-quick-link',
            title: 'Alt Codes',
            href: 'https://www.alt-codes.net/',
            background: '#4f5b61',
            glyph: 'ALT',
            fontSize: 8
          },
          {
            id: 'netflix-quick-link',
            title: 'Netflix',
            href: 'https://www.netflix.com/',
            packageName: 'com.netflix.mediaclient',
            background: '#000000',
            foreground: '#e50914',
            glyph: 'N',
            fontSize: 15
          },
          {
            id: 'disneyplus-quick-link',
            title: 'Disney+',
            href: 'https://www.disneyplus.com/',
            packageName: 'com.disney.disneyplus',
            background: '#113ccf',
            glyph: 'D+',
            fontSize: 10
          },
          {
            id: 'youtube-quick-link',
            title: 'YouTube',
            href: 'https://www.youtube.com/',
            packageName: 'com.google.android.youtube',
            background: '#ff0000',
            glyph: '▶',
            fontSize: 12
          }
        ];

        links.forEach(config => addQuickLink(documentRef, quickLinks, config));
      } catch (error) {
        console.warn('Unable to enhance HomeScreen quick links:', error);
      }
    });
  </script>
</body>
</html>
