<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guyler's HomeScreen</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #20282d; font-family: system-ui, sans-serif; }
    .site-menu {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: #20282d;
      border-bottom: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 4px 14px rgba(0,0,0,.24);
    }
    .site-menu a {
      padding: 10px 17px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      line-height: 1;
    }
    .site-menu a:hover,
    .site-menu a:focus-visible { background: rgba(255,255,255,.14); }
    .site-menu a[aria-current="page"] { background: #9c6b3f; }
    .page-frame { width: 100%; height: calc(100% - 62px); border: 0; display: block; background: #e9e9e5; }
    @media (max-width: 480px) {
      .site-menu { height: 56px; gap: 4px; padding: 7px 8px; }
      .site-menu a { padding: 9px 12px; font-size: 14px; }
      .page-frame { height: calc(100% - 56px); }
    }
  </style>
</head>
<body>
  <nav class="site-menu" aria-label="Site navigation">
    <a href="/HomeScreen/" aria-current="page">Home</a>
    <a href="/HomeScreen/health/">Health</a>
    <a href="/HomeScreen/learn/">Learn</a>
  </nav>

  <iframe
    class="page-frame"
    src="home-content.html"
    title="HomeScreen home page"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <script>
    const homeFrame = document.querySelector('.page-frame');
    const isAndroid = /Android/i.test(navigator.userAgent);

    function buildAndroidIntent(webUrl, packageName) {
      const url = new URL(webUrl);
      const target = `${url.host}${url.pathname}${url.search}${url.hash}`;
      return `intent://${target}#Intent;scheme=${url.protocol.replace(':', '')};package=${packageName};S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
    }

    function enableAppFirst(link, packageName) {
      if (!link || !packageName || link.dataset.appFirst === 'true') return;

      link.dataset.appFirst = 'true';
      const webUrl = link.href;

      link.addEventListener('click', event => {
        if (!isAndroid) return;

        event.preventDefault();
        window.location.href = buildAndroidIntent(webUrl, packageName);
      });
    }

    function addNehemiahLink(documentRef, quickLinks) {
      let nehemiahLink = documentRef.getElementById('nehemiah-quick-link');

      if (!nehemiahLink) {
        nehemiahLink = documentRef.createElement('a');
        nehemiahLink.id = 'nehemiah-quick-link';
        nehemiahLink.className = 'quick-link';
        nehemiahLink.href = 'https://chatgpt.com/g/g-6a6f2147a4b48191978025f950045a49-nehemiah';
        nehemiahLink.target = '_blank';
        nehemiahLink.rel = 'noopener noreferrer';
        nehemiahLink.setAttribute('aria-label', 'Open Nehemiah in ChatGPT');
        nehemiahLink.title = 'Nehemiah';
        nehemiahLink.innerHTML = `
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle cx="16" cy="16" r="14" fill="#20282d"/>
            <path d="M10 23V9h3.3l5.4 8.2V9H22v14h-3.2l-5.5-8.3V23z" fill="#fff"/>
          </svg>`;
        quickLinks.appendChild(nehemiahLink);
      }

      enableAppFirst(nehemiahLink, 'com.openai.chatgpt');
    }

    homeFrame.addEventListener('load', () => {
      try {
        const documentRef = homeFrame.contentDocument;
        const quickLinks = documentRef?.querySelector('.quick-links');
        if (!quickLinks) return;

        enableAppFirst(documentRef.querySelector('a[title="Google Calendar"]'), 'com.google.android.calendar');
        enableAppFirst(documentRef.querySelector('a[title="Spotify"]'), 'com.spotify.music');
        enableAppFirst(documentRef.querySelector('a[title="AccuWeather"]'), 'com.accuweather.android');
        addNehemiahLink(documentRef, quickLinks);
      } catch (error) {
        console.warn('Unable to enhance HomeScreen quick links:', error);
      }
    });
  </script>
</body>
</html>
