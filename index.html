<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guyler's HomeScreen</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #20282d; font-family: system-ui, sans-serif; }
    .site-menu {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: #20282d;
      border-bottom: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 4px 14px rgba(0,0,0,.24);
    }
    .site-menu a {
      padding: 10px 17px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      line-height: 1;
    }
    .site-menu a:hover,
    .site-menu a:focus-visible { background: rgba(255,255,255,.14); }
    .site-menu a[aria-current="page"] { background: #9c6b3f; }
    .page-frame { width: 100%; height: calc(100% - 62px); border: 0; display: block; background: #e9e9e5; }
    @media (max-width: 480px) {
      .site-menu { height: 56px; gap: 4px; padding: 7px 8px; }
      .site-menu a { padding: 9px 12px; font-size: 14px; }
      .page-frame { height: calc(100% - 56px); }
    }
  </style>
</head>
<body>
  <nav class="site-menu" aria-label="Site navigation">
    <a href="/HomeScreen/" aria-current="page">Home</a>
    <a href="/HomeScreen/health/">Health</a>
    <a href="/HomeScreen/learn/">Learn</a>
  </nav>
  <iframe class="page-frame" src="home-content.html" title="HomeScreen home page" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</body>
</html>
