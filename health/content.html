<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obryn Health Cut</title>
  <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #07182A;
      --bg-2: #102D49;
      --card: rgba(10, 32, 55, .94);
      --panel: rgba(15, 43, 70, .96);
      --panel-soft: rgba(17, 52, 84, .64);
      --ink: #F3F7FB;
      --muted: #B6C9DB;
      --line: rgba(190, 214, 235, .18);
      --green: #45DB70;
      --green-2: #6BE784;
      --blue: #7DB9E8;
      --orange: #FF8126;
      --orange-soft: #FFAD62;
      --danger: #FF8A7A;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg-1); }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(255,129,38,.12), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(125,185,232,.16), transparent 28%),
        linear-gradient(160deg, var(--bg-1) 0%, #0A2037 58%, var(--bg-2) 100%);
      font-family: "Swanky and Moo Moo", cursive;
    }

    .card {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(0,0,0,.30);
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 4px 0 16px;
      font-size: clamp(3.1rem, 12vw, 5.2rem);
      line-height: .9;
      font-weight: 400;
    }

    h2, h3, h4 { font-weight: 400; }

    .status {
      margin: 0 0 22px;
      padding: 14px 16px;
      border: 1px solid rgba(69,219,112,.24);
      border-radius: 18px;
      background: rgba(63,227,109,.10);
      font-size: 1.3rem;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    .metric, .tile {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
    }

    .metric {
      padding: 16px;
      border-radius: 20px;
    }

    .metric small, .metric span, .tile span { color: var(--muted); }

    .metric small {
      display: block;
      font-size: 1.02rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 2.55rem;
      line-height: 1;
      font-weight: 400;
    }

    .metric span { display: block; margin-top: 6px; font-size: 1.12rem; }
    .metric .imperial-loss { color: var(--green-2); font-size: 1.3rem; }

    .progress-wrap { margin: 12px 0 18px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 1.06rem;
    }
    .progress {
      width: 100%; height: 14px; overflow: hidden;
      border-radius: 999px; background: rgba(190,214,235,.14);
    }
    .bar {
      width: 0%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--green-2));
      transition: width 600ms ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .tile {
      padding: 12px 10px;
      text-align: center;
      border-radius: 16px;
    }
    .tile strong { display: block; font-size: 1.75rem; font-weight: 400; }
    .tile span { display: block; margin-top: 3px; font-size: 1rem; }

    .diary-link-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(69,219,112,.24);
      border-radius: 16px;
      background: rgba(63,227,109,.10);
    }
    .diary-link-wrap span { color: var(--muted); font-size: 1rem; line-height: 1.2; }
    .diary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--green);
      color: var(--bg-1);
      font-family: "Gloria Hallelujah", cursive;
      font-size: .82rem;
      font-weight: 700;
      text-decoration: none;
    }

    .coach {
      margin-top: 22px;
      padding: 20px;
      border: 1px solid rgba(255,129,38,.30);
      border-radius: 22px;
      background: rgba(255,129,38,.09);
    }

    .coach-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }
    .coach-heading h2 { margin: 0; color: var(--orange-soft); font-size: 2rem; }
    .coach-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 1.02rem; }
    .coach-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      font-family: "Gloria Hallelujah", cursive;
      font-size: .76rem;
      font-weight: 700;
    }

    .coach-section {
      margin-top: 12px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(10,32,55,.58);
    }
    .coach-section:first-of-type { margin-top: 0; }
    .coach-section h3 {
      margin: 0 0 9px;
      color: var(--blue);
      font-size: 1.08rem;
      letter-spacing: .055em;
      text-transform: uppercase;
    }
    .coach-section.action {
      border-left: 5px solid var(--orange);
      background: rgba(255,129,38,.08);
    }
    .coach-section.action h3 { color: var(--orange-soft); }

    .readable-list,
    .action-list,
    .source-list,
    .bibliography-list {
      margin: 0;
      padding-left: 1.25rem;
      font-family: "Gloria Hallelujah", cursive;
      line-height: 1.55;
    }
    .readable-list { font-size: .92rem; }
    .action-list { font-size: .96rem; }
    .readable-list li,
    .action-list li,
    .source-list li,
    .bibliography-list li { margin: 0 0 8px; }
    .readable-list li:last-child,
    .action-list li:last-child,
    .source-list li:last-child,
    .bibliography-list li:last-child { margin-bottom: 0; }

    .trend-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .trend-card {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel-soft);
    }
    .trend-card h4 {
      margin: 0 0 5px;
      color: var(--green-2);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .trend-card p { margin: 0; font-family: "Gloria Hallelujah", cursive; font-size: .88rem; line-height: 1.5; }

    .missing-note {
      margin: 0;
      color: var(--muted);
      font-family: "Gloria Hallelujah", cursive;
      font-size: .88rem;
      line-height: 1.5;
    }

    .sources-panel {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(7,24,42,.52);
      overflow: hidden;
    }
    .sources-panel summary {
      cursor: pointer;
      padding: 13px 15px;
      color: var(--blue);
      font-family: "Gloria Hallelujah", cursive;
      font-size: .9rem;
      font-weight: 700;
      list-style-position: inside;
    }
    .sources-inner { padding: 0 15px 15px; }
    .sources-block { padding-top: 12px; border-top: 1px solid var(--line); }
    .sources-block + .sources-block { margin-top: 12px; }
    .sources-block h4 { margin: 0 0 8px; color: var(--green-2); font-size: 1.05rem; }
    .source-list, .bibliography-list {
      color: var(--muted);
      font-size: .78rem;
    }
    .bibliography-list { padding-left: 1.4rem; }
    .source-link { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }

    .no-coach { margin: 12px 0 0; color: var(--muted); font-size: 1.15rem; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .95rem;
    }

    [hidden] { display: none !important; }

    @media (max-width: 680px) {
      body { padding: 16px; }
      .card { padding: 20px; border-radius: 22px; }
      .hero { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .diary-link-wrap { align-items: stretch; flex-direction: column; }
      .diary-link { width: 100%; }
      .coach-heading { flex-direction: column; }
      .coach-badges { justify-content: flex-start; }
      .trend-grid { grid-template-columns: 1fr; }
      footer { flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="../assets/type-system.css?v=20261020-neon5">
</head>
<body>
  <main class="card" aria-live="polite">
    <header class="page-banner page-banner--health">
      <div><p class="eyebrow">Public accountability</p><h1>Health Cut</h1></div>
      <span class="banner-mascot banner-mascot--health" aria-hidden="true"></span>
    </header>
    <p class="status" id="status">Loading today’s numbers…</p>

    <div id="health-charts" aria-label="Health trends"></div>

    <section class="hero">
      <div class="metric">
        <small>Total lost</small>
        <strong id="lost">—</strong>
        <span class="imperial-loss" id="lost-imperial">—</span>
        <span id="weight-line">Today’s weight loading…</span>
      </div>
      <div class="metric">
        <small>BMI</small>
        <strong id="bmi">—</strong>
        <span>Data point, not identity.</span>
      </div>
    </section>

    <section class="progress-wrap">
      <div class="progress-label">
        <span id="checkpoint-label">Progress to checkpoint</span>
        <span id="checkpoint-percent">—</span>
      </div>
      <div class="progress"><div class="bar" id="progress-bar"></div></div>
    </section>

    <footer>
      <span id="updated">Updated: —</span>
      <span id="source">Source: Google Sheets</span>
    </footer>
  </main>

  <script>
    const REMOTE_METRICS_URL = "https://script.google.com/macros/s/AKfycbwihWQw8Frs1acA1Y-CELBw0NmX4O5KFzcqU3f8TbFpSegleKyPM64TkqTyoNyAWhLP/exec";

    const fallback = {
      startingWeightKg: null,
      currentWeightKg: null,
      checkpointWeightKg: null,
      finalGoalKg: null,
      heightM: null,
      currentBmi: null,
      totalLostKg: null,
      checkpointProgressPercent: null,
      lastUpdated: "Live data unavailable",
      accountabilityStatus: "Live data did not load. Check the Apps Script endpoint."
    };

    function hasValue(value) {
      return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function toNumber(value) {
      if (!hasValue(value)) return null;
      const number = Number(String(value).replace(/,/g, "").trim());
      return Number.isFinite(number) ? number : null;
    }

    function textOrBlank(value) {
      return hasValue(value) ? String(value).trim() : "";
    }

    function setText(id, value) {
      const element = document.getElementById(id);
      if (element) element.textContent = value;
    }

    function formatKg(value) {
      const number = toNumber(value);
      return number === null ? "—" : `${number.toFixed(1)} kg`;
    }

    function formatWholeNumber(value, suffix = "") {
      const number = toNumber(value);
      return number === null ? "—" : `${Math.round(number).toLocaleString("en-GB")}${suffix}`;
    }

    function formatStonePounds(valueKg) {
      const kilograms = toNumber(valueKg);
      if (kilograms === null) return "—";
      const sign = kilograms < 0 ? "−" : "";
      const totalOunces = Math.round(Math.abs(kilograms) * 2.2046226218 * 16);
      const stones = Math.floor(totalOunces / 224);
      const remainder = totalOunces % 224;
      const pounds = Math.floor(remainder / 16);
      const ounces = remainder % 16;
      return `${sign}${stones} st ${pounds} ${pounds === 1 ? "lb" : "lbs"} ${ounces} oz`;
    }

    function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

    function normalizePayload(payload) {
      if (payload && payload.metrics) return payload.metrics;
      if (payload && typeof payload === "object") return payload;
      return fallback;
    }

    function render(metrics, sourceLabel = "Google Sheets") {
      const start = toNumber(metrics.startingWeightKg);
      const current = toNumber(metrics.currentWeightKg);
      const checkpoint = toNumber(metrics.checkpointWeightKg);
      const height = toNumber(metrics.heightM);
      const suppliedBmi = toNumber(metrics.currentBmi);
      const bmi = current !== null && height !== null && height > 0 ? current / (height ** 2) : suppliedBmi;
      const suppliedLost = toNumber(metrics.totalLostKg);
      const lost = start !== null && current !== null ? start - current : suppliedLost;
      const suppliedProgress = toNumber(metrics.checkpointProgressPercent);
      const calculatedProgress = start !== null && current !== null && checkpoint !== null && start !== checkpoint
        ? ((start - current) / (start - checkpoint)) * 100
        : null;
      const progressSource = calculatedProgress !== null ? calculatedProgress : suppliedProgress;
      const progress = progressSource === null ? null : clamp(progressSource, 0, 100);
      const todayExists = textOrBlank(metrics.lastUpdated) !== "No entry for today";

      setText("status", todayExists
        ? textOrBlank(metrics.accountabilityStatus) || "Today’s health data is live."
        : "No health entry has been logged for today.");

      setText("lost", formatKg(lost));
      setText("lost-imperial", formatStonePounds(lost));
      setText("weight-line", current === null
        ? `No weight logged for today · Start: ${formatKg(start)}`
        : `Current: ${formatKg(current)} · Start: ${formatKg(start)}`);
      setText("bmi", bmi === null ? "—" : bmi.toFixed(1));
      setText("checkpoint-label", checkpoint === null ? "Progress to checkpoint" : `Progress to ${formatKg(checkpoint)} checkpoint`);
      setText("checkpoint-percent", progress === null ? "—" : `${progress.toFixed(0)}%`);
      document.getElementById("progress-bar").style.width = `${progress === null ? 0 : progress}%`;

      setText("updated", `Updated: ${textOrBlank(metrics.lastUpdated) || "—"}`);
      setText("source", `Source: ${sourceLabel}`);
    }

    async function loadMetrics() {
      try {
        let payload;
        let sharedLoader = null;
        try {
          if (window.parent !== window && typeof window.parent.getHealthData === "function") sharedLoader = window.parent.getHealthData;
        } catch (error) { sharedLoader = null; }

        if (sharedLoader) {
          payload = await sharedLoader({ force: true });
        } else {
          const response = await fetch(`${REMOTE_METRICS_URL}?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          payload = await response.json();
        }
        render(normalizePayload(payload), payload.source || "Google Sheets");
      } catch (error) {
        console.warn("Health Cut metrics failed to load:", error);
        render(fallback, "Unavailable");
      }
    }

    loadMetrics();
  </script>
</body>
</html>
