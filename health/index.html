<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obryn Health Cut</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #20282d; font-family: system-ui, sans-serif; }
    .site-menu {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: #20282d;
      border-bottom: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 4px 14px rgba(0,0,0,.24);
    }
    .site-menu a {
      padding: 10px 17px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      line-height: 1;
    }
    .site-menu a:hover,
    .site-menu a:focus-visible { background: rgba(255,255,255,.14); }
    .site-menu a[aria-current="page"] { background: #2d574b; }
    .page-frame {
      width: 100%;
      height: calc(100% - 62px);
      border: 0;
      display: block;
      background: #20282d;
    }
    @media (max-width: 480px) {
      .site-menu { height: 56px; gap: 4px; padding: 7px 8px; }
      .site-menu a { padding: 9px 12px; font-size: 14px; }
      .page-frame { height: calc(100% - 56px); }
    }
  </style>
</head>
<body>
  <nav class="site-menu" aria-label="Site navigation">
    <a href="/HomeScreen/">Home</a>
    <a href="/HomeScreen/health/" aria-current="page">Health</a>
    <a href="/HomeScreen/learn/">Learn</a>
  </nav>

  <iframe
    class="page-frame"
    src="content.html"
    title="Health page"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <script>
    const HEALTH_DATA_URL = "https://script.google.com/macros/s/AKfycbwihWQw8Frs1acA1Y-CELBw0NmX4O5KFzcqU3f8TbFpSegleKyPM64TkqTyoNyAWhLP/exec";
    const healthFrame = document.querySelector(".page-frame");
    let currentWeightHistory = [];
    let currentChartState = null;

    function toNumber(value) {
      if (value === null || value === undefined || String(value).trim() === "") return null;
      const number = Number(String(value).replace(/,/g, "").trim());
      return Number.isFinite(number) ? number : null;
    }

    function formatKg(value) {
      const number = toNumber(value);
      return number === null ? "—" : `${number.toFixed(1)} kg`;
    }

    function parseWeightHistory(value) {
      let history = value;

      if (typeof history === "string") {
        try {
          history = JSON.parse(history);
        } catch (error) {
          console.warn("Weight history could not be parsed:", error);
          return [];
        }
      }

      if (!Array.isArray(history)) return [];

      return history
        .map(entry => {
          const weightKg = toNumber(entry?.weightKg);
          const timestamp = Date.parse(`${entry?.date || ""}T12:00:00`);
          return {
            date: entry?.date || "",
            timestamp,
            weightKg
          };
        })
        .filter(entry =>
          entry.date &&
          Number.isFinite(entry.timestamp) &&
          entry.weightKg !== null &&
          entry.weightKg > 0
        )
        .sort((a, b) => a.timestamp - b.timestamp);
    }

    function buildRollingAverageSeries(history, windowDays, minimumReadings) {
      const windowMs = (windowDays - 1) * 24 * 60 * 60 * 1000;

      return history.map(entry => {
        const windowStart = entry.timestamp - windowMs;
        const readings = history.filter(candidate =>
          candidate.timestamp >= windowStart &&
          candidate.timestamp <= entry.timestamp
        );

        if (readings.length < minimumReadings) {
          return { ...entry, averageKg: null, readingCount: readings.length };
        }

        const averageKg = readings.reduce((sum, reading) => sum + reading.weightKg, 0) / readings.length;
        return { ...entry, averageKg, readingCount: readings.length };
      });
    }

    function latestAvailable(series) {
      for (let index = series.length - 1; index >= 0; index -= 1) {
        if (series[index].averageKg !== null) return series[index];
      }
      return null;
    }

    function formatChartDate(timestamp, includeYear = false) {
      return new Intl.DateTimeFormat("en-GB", {
        day: "numeric",
        month: "short",
        ...(includeYear ? { year: "numeric" } : {})
      }).format(new Date(timestamp));
    }

    function injectChart(doc) {
      if (doc.getElementById("weight-trend-section")) return;

      const style = doc.createElement("style");
      style.id = "weight-trend-styles";
      style.textContent = `
        .chart-card {
          margin-bottom: 18px;
          padding: 18px;
          border: 1px solid rgba(45, 87, 75, 0.20);
          border-radius: 22px;
          background: rgba(247, 249, 248, 0.82);
          overflow: hidden;
        }
        .chart-heading {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 18px;
          margin-bottom: 14px;
        }
        .chart-heading h2 {
          margin: 0;
          color: var(--accent);
          font-size: 2rem;
          font-weight: 400;
        }
        .chart-heading p {
          margin: 3px 0 0;
          color: var(--muted);
          font-size: 1.05rem;
        }
        .chart-summary {
          display: grid;
          grid-template-columns: repeat(3, minmax(82px, 1fr));
          gap: 7px;
          min-width: min(100%, 294px);
          font-family: system-ui, sans-serif;
        }
        .chart-chip {
          padding: 7px 10px 8px;
          border: 1px solid var(--line);
          border-radius: 12px;
          background: rgba(255,255,255,0.82);
          text-align: center;
        }
        .chart-chip small {
          display: block;
          color: var(--muted);
          font-size: 0.66rem;
          font-weight: 700;
          letter-spacing: 0.045em;
          text-transform: uppercase;
        }
        .chart-chip strong {
          display: block;
          margin-top: 2px;
          color: var(--ink);
          font-size: 0.94rem;
        }
        .chart-chip.current { box-shadow: inset 0 3px 0 #647985; }
        .chart-chip.current strong { color: #647985; }
        .chart-chip.seven { box-shadow: inset 0 3px 0 #9c6b3f; }
        .chart-chip.seven strong { color: #9c6b3f; }
        .chart-chip.fourteen { box-shadow: inset 0 3px 0 #2d574b; }
        .chart-chip.fourteen strong { color: #2d574b; }
        .chart-note {
          margin: 0 0 9px;
          color: var(--muted);
          font-family: system-ui, sans-serif;
          font-size: 0.76rem;
        }
        .chart-wrap {
          position: relative;
          width: 100%;
          height: 310px;
          border-radius: 14px;
          background: rgba(255,255,255,0.46);
          overflow: hidden;
        }
        #weight-trend-canvas {
          display: block;
          width: 100%;
          height: 100%;
          touch-action: manipulation;
        }
        .chart-tooltip {
          position: absolute;
          z-index: 2;
          min-width: 154px;
          padding: 9px 11px;
          border: 1px solid rgba(32,40,45,0.15);
          border-radius: 11px;
          background: rgba(250,250,248,0.97);
          box-shadow: 0 6px 18px rgba(32,40,45,0.13);
          color: var(--ink);
          font-family: system-ui, sans-serif;
          font-size: 0.75rem;
          line-height: 1.42;
          pointer-events: none;
          transform: translate(-50%, calc(-100% - 10px));
        }
        .chart-tooltip strong {
          display: block;
          margin-bottom: 3px;
          font-size: 0.8rem;
        }
        .chart-tooltip span { display: block; }
        .chart-empty {
          display: grid;
          place-items: center;
          min-height: 180px;
          margin: 0;
          color: var(--muted);
          font-size: 1.2rem;
          text-align: center;
        }
        @media (max-width: 620px) {
          .chart-heading { flex-direction: column; }
          .chart-summary { width: 100%; min-width: 0; }
          .chart-wrap { height: 270px; }
          .chart-card { padding: 16px; }
        }
        @media (max-width: 390px) {
          .chart-chip { padding-inline: 6px; }
          .chart-chip strong { font-size: 0.86rem; }
        }
      `;
      doc.head.appendChild(style);

      const section = doc.createElement("section");
      section.id = "weight-trend-section";
      section.className = "chart-card";
      section.setAttribute("aria-labelledby", "weight-trend-heading");
      section.innerHTML = `
        <div class="chart-heading">
          <div>
            <h2 id="weight-trend-heading">Weight Progress</h2>
            <p>Daily weigh-ins with short- and medium-term trends.</p>
          </div>
          <div class="chart-summary" id="weight-trend-summary" hidden>
            <div class="chart-chip current">
              <small>Current</small>
              <strong id="weight-trend-current">—</strong>
            </div>
            <div class="chart-chip seven">
              <small>7-day avg</small>
              <strong id="weight-trend-seven">—</strong>
            </div>
            <div class="chart-chip fourteen">
              <small>14-day avg</small>
              <strong id="weight-trend-fourteen">—</strong>
            </div>
          </div>
        </div>
        <p class="chart-note">7-day average needs 4 readings · 14-day average needs 8.</p>
        <div class="chart-wrap" id="weight-trend-wrap">
          <canvas
            id="weight-trend-canvas"
            role="img"
            aria-label="Weight progress chart showing individual weigh-ins plus 7-day and 14-day rolling averages in kilograms by date">
            Weight history chart.
          </canvas>
          <div class="chart-tooltip" id="weight-trend-tooltip" hidden aria-live="polite"></div>
          <p class="chart-empty" id="weight-trend-empty" hidden>
            Not enough valid weight logs to draw the trend yet.
          </p>
        </div>
      `;

      const hero = doc.querySelector(".hero");
      if (hero) hero.before(section);
    }

    function setChartText(doc, id, value) {
      const element = doc.getElementById(id);
      if (element) element.textContent = value;
    }

    function positionTooltip(doc, point) {
      const tooltip = doc.getElementById("weight-trend-tooltip");
      if (!tooltip || !currentChartState) return;

      const { cssWidth, history, sevenDaySeries, fourteenDaySeries } = currentChartState;
      const index = point.index;
      const raw = history[index];
      const seven = sevenDaySeries[index]?.averageKg ?? null;
      const fourteen = fourteenDaySeries[index]?.averageKg ?? null;
      const safeX = Math.min(Math.max(point.x, 82), cssWidth - 82);

      tooltip.innerHTML = `
        <strong>${formatChartDate(raw.timestamp, true)}</strong>
        <span>Weight: ${formatKg(raw.weightKg)}</span>
        <span>7-day: ${seven === null ? "Not available" : formatKg(seven)}</span>
        <span>14-day: ${fourteen === null ? "Not available" : formatKg(fourteen)}</span>
      `;
      tooltip.style.left = `${safeX}px`;
      tooltip.style.top = `${Math.max(58, point.y)}px`;
      tooltip.hidden = false;
    }

    function hideTooltip(doc) {
      const tooltip = doc.getElementById("weight-trend-tooltip");
      if (tooltip) tooltip.hidden = true;
    }

    function installChartInteraction(doc) {
      const canvas = doc.getElementById("weight-trend-canvas");
      if (!canvas || canvas.dataset.interactionReady === "true") return;
      canvas.dataset.interactionReady = "true";

      function showNearest(event) {
        if (!currentChartState?.interactivePoints?.length) return;
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        let nearest = null;
        let nearestDistance = Infinity;
        currentChartState.interactivePoints.forEach(point => {
          const distance = Math.hypot(point.x - x, point.y - y);
          if (distance < nearestDistance) {
            nearest = point;
            nearestDistance = distance;
          }
        });

        if (nearest && nearestDistance <= 30) positionTooltip(doc, nearest);
        else hideTooltip(doc);
      }

      canvas.addEventListener("pointermove", showNearest);
      canvas.addEventListener("pointerdown", showNearest);
      canvas.addEventListener("pointerleave", () => hideTooltip(doc));
    }

    function drawWeightChart(doc, history) {
      currentWeightHistory = history;

      const canvas = doc.getElementById("weight-trend-canvas");
      const wrap = doc.getElementById("weight-trend-wrap");
      const empty = doc.getElementById("weight-trend-empty");
      const summary = doc.getElementById("weight-trend-summary");

      if (!canvas || !wrap || !empty || !summary) return;

      hideTooltip(doc);

      if (history.length < 2) {
        canvas.hidden = true;
        empty.hidden = false;
        summary.hidden = true;
        currentChartState = null;
        return;
      }

      canvas.hidden = false;
      empty.hidden = true;
      summary.hidden = false;

      const latest = history[history.length - 1];
      const sevenDaySeries = buildRollingAverageSeries(history, 7, 4);
      const fourteenDaySeries = buildRollingAverageSeries(history, 14, 8);
      const latestSeven = latestAvailable(sevenDaySeries);
      const latestFourteen = latestAvailable(fourteenDaySeries);

      setChartText(doc, "weight-trend-current", formatKg(latest.weightKg));
      setChartText(doc, "weight-trend-seven", latestSeven ? formatKg(latestSeven.averageKg) : "—");
      setChartText(doc, "weight-trend-fourteen", latestFourteen ? formatKg(latestFourteen.averageKg) : "—");

      const rect = wrap.getBoundingClientRect();
      const cssWidth = Math.max(300, Math.floor(rect.width));
      const cssHeight = Math.max(220, Math.floor(rect.height));
      const pixelRatio = Math.min(doc.defaultView?.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(cssWidth * pixelRatio);
      canvas.height = Math.floor(cssHeight * pixelRatio);

      const context = canvas.getContext("2d");
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      context.clearRect(0, 0, cssWidth, cssHeight);

      const compact = cssWidth < 520;
      const margin = {
        top: 18,
        right: compact ? 18 : 22,
        bottom: 42,
        left: compact ? 47 : 56
      };
      const plotWidth = cssWidth - margin.left - margin.right;
      const plotHeight = cssHeight - margin.top - margin.bottom;

      const weights = history.map(entry => entry.weightKg);
      const rawMin = Math.min(...weights);
      const rawMax = Math.max(...weights);
      const rawRange = rawMax - rawMin;
      const desiredSpan = Math.max(4, Math.ceil((rawRange + 1) * 2) / 2);
      const midpoint = (rawMin + rawMax) / 2;
      let yMin = Math.floor((midpoint - desiredSpan / 2) * 2) / 2;
      let yMax = yMin + desiredSpan;

      if (rawMin < yMin + 0.2) {
        yMin = Math.floor((rawMin - 0.4) * 2) / 2;
        yMax = yMin + desiredSpan;
      }
      if (rawMax > yMax - 0.2) {
        yMax = Math.ceil((rawMax + 0.4) * 2) / 2;
        yMin = yMax - desiredSpan;
      }

      const yRange = Math.max(1, yMax - yMin);
      const startTime = history[0].timestamp;
      const endTime = history[history.length - 1].timestamp;
      const timeRange = Math.max(1, endTime - startTime);

      const xFor = timestamp =>
        margin.left + ((timestamp - startTime) / timeRange) * plotWidth;
      const yFor = weight =>
        margin.top + ((yMax - weight) / yRange) * plotHeight;

      context.font = `${compact ? 10 : 11}px system-ui, sans-serif`;
      context.textBaseline = "middle";
      context.lineWidth = 1;

      const horizontalLines = 4;
      for (let index = 0; index <= horizontalLines; index += 1) {
        const ratio = index / horizontalLines;
        const y = margin.top + ratio * plotHeight;
        const value = yMax - ratio * yRange;

        context.beginPath();
        context.moveTo(margin.left, y);
        context.lineTo(margin.left + plotWidth, y);
        context.strokeStyle = "rgba(32, 40, 45, 0.085)";
        context.stroke();

        context.fillStyle = "#617078";
        context.textAlign = "right";
        context.fillText(`${value.toFixed(1)}`, margin.left - 8, y);
      }

      context.fillStyle = "#78858b";
      context.textAlign = "left";
      context.fillText("kg", 7, margin.top - 6);

      const dayMs = 24 * 60 * 60 * 1000;
      const tickInterval = (compact ? 14 : 7) * dayMs;
      let tick = startTime;
      let tickIndex = 0;
      while (tick <= endTime + dayMs / 2) {
        const x = xFor(tick);
        context.fillStyle = "#69777e";
        context.textAlign = tickIndex === 0 ? "left" : "center";
        context.fillText(formatChartDate(tick), x, cssHeight - 17);
        tick += tickInterval;
        tickIndex += 1;
      }

      function drawSeries(series, valueKey, strokeStyle, lineWidth) {
        let drawing = false;
        context.beginPath();
        context.setLineDash([]);

        series.forEach(entry => {
          const value = entry[valueKey];
          if (value === null || value === undefined) {
            drawing = false;
            return;
          }

          const x = xFor(entry.timestamp);
          const y = yFor(value);
          if (!drawing) {
            context.moveTo(x, y);
            drawing = true;
          } else {
            context.lineTo(x, y);
          }
        });

        context.strokeStyle = strokeStyle;
        context.lineWidth = lineWidth;
        context.lineJoin = "round";
        context.lineCap = "round";
        context.stroke();
      }

      const interactivePoints = history.map((entry, index) => {
        const x = xFor(entry.timestamp);
        const y = yFor(entry.weightKg);

        context.beginPath();
        context.arc(x, y, index === history.length - 1 ? 4.5 : 3.5, 0, Math.PI * 2);
        context.fillStyle = "#647985";
        context.fill();
        context.lineWidth = 1.4;
        context.strokeStyle = "rgba(250,250,248,0.98)";
        context.stroke();

        return { index, x, y };
      });

      drawSeries(sevenDaySeries, "averageKg", "#9c6b3f", 3);
      drawSeries(fourteenDaySeries, "averageKg", "#2d574b", 4.5);

      canvas.setAttribute(
        "aria-label",
        `Weight progress. Current ${latest.weightKg.toFixed(1)} kilograms. ` +
        `7-day average ${latestSeven ? latestSeven.averageKg.toFixed(1) + " kilograms" : "not available"}. ` +
        `14-day average ${latestFourteen ? latestFourteen.averageKg.toFixed(1) + " kilograms" : "not available"}.`
      );

      currentChartState = {
        cssWidth,
        history,
        sevenDaySeries,
        fourteenDaySeries,
        interactivePoints
      };

      installChartInteraction(doc);
    }

    async function loadWeightHistory(doc) {
      try {
        const response = await fetch(`${HEALTH_DATA_URL}?t=${Date.now()}`, {
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const payload = await response.json();
        const data = payload.metrics || payload;
        drawWeightChart(doc, parseWeightHistory(data.weightHistory));
      } catch (error) {
        console.warn("Weight progress failed to load:", error);
        drawWeightChart(doc, []);
      }
    }

    healthFrame.addEventListener("load", () => {
      try {
        const doc = healthFrame.contentDocument;
        if (!doc) return;

        injectChart(doc);
        loadWeightHistory(doc);

        let resizeFrame;
        doc.defaultView?.addEventListener("resize", () => {
          doc.defaultView.cancelAnimationFrame(resizeFrame);
          resizeFrame = doc.defaultView.requestAnimationFrame(() => {
            if (currentWeightHistory.length) {
              drawWeightChart(doc, currentWeightHistory);
            }
          });
        });
      } catch (error) {
        console.warn("Unable to add weight progress chart:", error);
      }
    });
  </script>
</body>
</html>
