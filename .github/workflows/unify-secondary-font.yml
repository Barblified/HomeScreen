name: Unify HomeScreen secondary font

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-secondary-font.yml'

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Gloria Hallelujah as secondary font
        shell: python
        run: |
          from pathlib import Path
          import re

          html_files = [
              Path('index.html'),
              Path('health/index.html'),
              Path('learn/index.html'),
              Path('home-content.html'),
              Path('health/content.html'),
              Path('learn/content.html'),
              Path('learn/v2.html'),
          ]

          google_font_href = 'https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Swanky+and+Moo+Moo&display=swap'

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'https://fonts\.googleapis\.com/css2\?family=[^\"]+&display=swap',
                  google_font_href,
                  text
              )
              text = text.replace('font-family: system-ui, sans-serif;', 'font-family: "Gloria Hallelujah", cursive;')
              text = text.replace('font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;', 'font-family: "Gloria Hallelujah", cursive;')
              text = text.replace('font-family: "Cabin", system-ui, sans-serif;', 'font-family: "Gloria Hallelujah", cursive;')
              text = text.replace('font-family: Arial, sans-serif;', 'font-family: "Gloria Hallelujah", cursive;')
              path.write_text(text, encoding='utf-8')

          css_files = [Path('learn/v2.css')]
          for path in css_files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('font-family:system-ui,sans-serif', 'font-family:"Gloria Hallelujah",cursive')
              text = text.replace('font-family: system-ui, sans-serif;', 'font-family: "Gloria Hallelujah", cursive;')
              text = text.replace('font-family:Arial,sans-serif', 'font-family:"Gloria Hallelujah",cursive')
              path.write_text(text, encoding='utf-8')

          js_files = [
              Path('assets/home-weight-chart.js'),
              Path('assets/health-weight-chart.js'),
              Path('assets/quick-links-extra.js'),
          ]
          for path in js_files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('font-family: system-ui, sans-serif;', 'font-family: "Gloria Hallelujah", cursive;')
              text = text.replace('px system-ui, sans-serif`', 'px "Gloria Hallelujah", cursive`')
              text = text.replace("px system-ui, sans-serif'", "px \\\"Gloria Hallelujah\\\", cursive'")
              path.write_text(text, encoding='utf-8')

      - name: Validate font policy
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('index.html'), Path('health/index.html'), Path('learn/index.html'),
              Path('home-content.html'), Path('health/content.html'), Path('learn/content.html'), Path('learn/v2.html'),
              Path('learn/v2.css'), Path('assets/home-weight-chart.js'), Path('assets/health-weight-chart.js'), Path('assets/quick-links-extra.js')
          ]
          banned = ['system-ui', '"Cabin"', 'Arial, sans-serif', 'Segoe UI']
          failures = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              for token in banned:
                  if token in text:
                      failures.append(f'{path}: {token}')
          if failures:
              raise RuntimeError('Non-approved font references remain: ' + ', '.join(failures))

          for path in [Path('index.html'), Path('health/index.html'), Path('learn/index.html'), Path('home-content.html'), Path('health/content.html'), Path('learn/content.html'), Path('learn/v2.html')]:
              text = path.read_text(encoding='utf-8')
              if 'family=Gloria+Hallelujah&family=Swanky+and+Moo+Moo' not in text:
                  raise RuntimeError(f'Gloria Hallelujah font import missing from {path}')

      - name: Commit font update
        run: |
          rm .github/workflows/unify-secondary-font.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html health/index.html learn/index.html home-content.html health/content.html learn/content.html learn/v2.html learn/v2.css assets/home-weight-chart.js assets/health-weight-chart.js assets/quick-links-extra.js .github/workflows/unify-secondary-font.yml
          git commit -m "Use Gloria Hallelujah as secondary site font"
          git push
