name: Compact weight chart axis
on:
  push:
    paths:
      - '.github/workflows/compact-weight-axis.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove empty-date spacing from weight charts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('assets/home-weight-chart.js'), Path('assets/health-weight-chart.js')]

          rolling_re = re.compile(
              r"  function buildRollingAverageSeries\(history, windowDays, minimumReadings\) \{.*?\n  \}\n\n  function buildLinearTrendSeries",
              re.S,
          )
          new_rolling = '''  function buildRollingAverageSeries(history, windowSize, minimumReadings) {
            return history.map((entry, index) => {
              const readings = history.slice(Math.max(0, index - windowSize + 1), index + 1);
              if (readings.length < minimumReadings) {
                return { ...entry, averageKg: null, readingCount: readings.length };
              }
              const averageKg = readings.reduce((sum, reading) => sum + reading.weightKg, 0) / readings.length;
              return { ...entry, averageKg, readingCount: readings.length };
            });
          }

          function buildLinearTrendSeries'''
          new_rolling = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_rolling.splitlines())

          linear_re = re.compile(
              r"  function buildLinearTrendSeries\(history\) \{.*?\n  \}\n\n  function latestAvailable",
              re.S,
          )
          new_linear = '''  function buildLinearTrendSeries(history) {
            if (history.length < 2) return [];

            const points = history.map((entry, index) => ({
              x: index,
              y: entry.weightKg
            }));
            const meanX = points.reduce((sum, point) => sum + point.x, 0) / points.length;
            const meanY = points.reduce((sum, point) => sum + point.y, 0) / points.length;
            const denominator = points.reduce((sum, point) => sum + ((point.x - meanX) ** 2), 0);
            const numerator = points.reduce((sum, point) => sum + ((point.x - meanX) * (point.y - meanY)), 0);
            const slope = denominator === 0 ? 0 : numerator / denominator;
            const intercept = meanY - slope * meanX;

            return history.map((entry, index) => ({
              ...entry,
              trendKg: intercept + slope * index
            }));
          }

          function latestAvailable'''
          new_linear = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_linear.splitlines())

          axis_re = re.compile(
              r"    const yRange = Math\.max\(1, yMax - yMin\);\n.*?    const yFor = weight => margin\.top \+ \(\(yMax - weight\) / yRange\) \* plotHeight;",
              re.S,
          )
          new_axis = '''    const yRange = Math.max(1, yMax - yMin);
    const pointCount = history.length;
    const xForIndex = index => margin.left + (index / Math.max(1, pointCount - 1)) * plotWidth;
    const yFor = weight => margin.top + ((yMax - weight) / yRange) * plotHeight;'''

          tick_re = re.compile(
              r"    const dayMs = 24 \* 60 \* 60 \* 1000;\n.*?\n    function drawSeries\(series, valueKey, strokeStyle, lineWidth\) \{",
              re.S,
          )
          tick_template = '''    const maxTicks = compact ? 4 : 7;
    const tickStep = Math.max(1, Math.ceil((pointCount - 1) / Math.max(1, maxTicks - 1)));
    const tickIndices = [];
    for (let index = 0; index < pointCount; index += tickStep) tickIndices.push(index);
    if (tickIndices[tickIndices.length - 1] !== pointCount - 1) tickIndices.push(pointCount - 1);

    tickIndices.forEach((historyIndex, tickIndex) => {
      const x = xForIndex(historyIndex);
      context.fillStyle = '#B6C9DB';
      context.textAlign = tickIndex === 0 ? 'left' : historyIndex === pointCount - 1 ? 'right' : 'center';
      context.fillText(FORMATTER(history[historyIndex].timestamp), x, cssHeight - 17);
    });

    function drawSeries(series, valueKey, strokeStyle, lineWidth) {'''

          for path in files:
              text = path.read_text()

              text, count = rolling_re.subn(new_rolling, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: rolling-average block replacement failed')

              text, count = linear_re.subn(new_linear, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: linear-trend block replacement failed')

              text, count = axis_re.subn(new_axis, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: axis block replacement failed')

              formatter = 'formatDate' if path.name.startswith('home-') else 'formatChartDate'
              text, count = tick_re.subn(tick_template.replace('FORMATTER', formatter), text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: tick block replacement failed')

              text = text.replace('series.forEach(entry => {', 'series.forEach((entry, index) => {')
              text = text.replace('const x = xFor(entry.timestamp);', 'const x = xForIndex(index);')
              text = text.replace('sevenDaySeries', 'sevenReadingSeries')
              text = text.replace('fourteenDaySeries', 'fourteenReadingSeries')
              text = text.replace('7-day', '7-log')
              text = text.replace('14-day', '14-log')
              text = text.replace('Daily weigh-ins with short- and medium-term trends.', 'Logged weigh-ins with short- and medium-term trends.')
              text = text.replace(
                  '7-log average needs 4 readings · 14-log average needs 8 · Sky-blue line = overall linear trend.',
                  '7-log average starts after 4 readings · 14-log average starts after 8 · Empty dates are removed · Sky-blue line = overall linear trend.'
              )
              text = text.replace('in kilograms by date', 'in kilograms across logged weigh-ins')

              path.write_text(text)
          PY
          node --check assets/home-weight-chart.js
          node --check assets/health-weight-chart.js
      - name: Commit chart update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-weight-chart.js assets/health-weight-chart.js
          git diff --cached --quiet || git commit -m "Remove empty days from weight chart spacing"
          git push