name: Add Faith quick links
# trigger migration
on:
  push:
    paths:
      - '.github/workflows/add-faith-links.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Faith category and icons
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('assets/home-dashboard.js')
          text = dashboard.read_text()
          if "name: 'Faith'" not in text:
              marker = "    {\n      name: 'Life & Leisure',"
              faith = """    {
      name: 'Faith',
      description: 'Scripture, prayer, theology and thoughtful Christian formation.',
      links: [
        { title: 'Bible.com', href: 'https://www.bible.com/', icon: 'bible', sprite: CORE_SPRITE, packageName: 'com.sirma.mobile.bible.android' },
        { title: 'BibleProject', href: 'https://bibleproject.com/', icon: 'bibleproject', sprite: EXTRA_SPRITE },
        { title: 'STEP Bible', href: 'https://www.stepbible.org/', icon: 'stepbible', sprite: EXTRA_SPRITE },
        { title: 'Church of England Daily Prayer', href: 'https://www.churchofengland.org/prayer-and-worship/join-us-service-daily-prayer', icon: 'cofdailyprayer', sprite: EXTRA_SPRITE },
        { title: 'Lectio 365', href: 'https://www.24-7prayer.com/resource/lectio-365/', icon: 'lectio365', sprite: EXTRA_SPRITE },
        { title: 'Pray As You Go', href: 'https://pray-as-you-go.org/', icon: 'prayasyougo', sprite: EXTRA_SPRITE },
        { title: 'BioLogos', href: 'https://biologos.org/', icon: 'biologos', sprite: EXTRA_SPRITE },
        { title: 'Bible Odyssey', href: 'https://www.bibleodyssey.org/', icon: 'bibleodyssey', sprite: EXTRA_SPRITE }
      ]
    },
"""
              if marker not in text:
                  raise SystemExit('Life & Leisure category marker not found')
              text = text.replace(marker, faith + marker, 1)
              dashboard.write_text(text)

          sprite = Path('assets/quick-links-extra.svg')
          svg = sprite.read_text()
          if 'id="bibleproject"' not in svg:
              icons = r'''
  <symbol id="bibleproject" viewBox="0 0 32 32"><path d="M6 6h9c3 0 5 2 5 5v15c-2-2-4-3-7-3H6V6Z" fill="#7DB9E8"/><path d="M26 6h-9c-3 0-5 2-5 5v15c2-2 4-3 7-3h7V6Z" fill="#FF8126"/><path d="M16 9v15" stroke="#F3F7FB" stroke-width="1.7"/></symbol>
  <symbol id="stepbible" viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="22" rx="4" fill="#0F2B45" stroke="#7DB9E8" stroke-width="1.6"/><path d="M9 21h5v-4h5v-4h5" fill="none" stroke="#45DB70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 10h14" stroke="#F3F7FB" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="cofdailyprayer" viewBox="0 0 32 32"><path d="M16 4v24M9 11h14" stroke="#F3F7FB" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="16" r="12" fill="none" stroke="#7DB9E8" stroke-width="1.5"/><path d="M7 24c5-3 13-3 18 0" fill="none" stroke="#45DB70" stroke-width="1.8"/></symbol>
  <symbol id="lectio365" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#0F2B45" stroke="#45DB70" stroke-width="1.8"/><path d="M10 11c4-2 8-2 12 0v11c-4-2-8-2-12 0V11Z" fill="#F3F7FB"/><path d="M16 12v9" stroke="#FF8126" stroke-width="1.7"/><path d="M23 7v5M20.5 9.5h5" stroke="#7DB9E8" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="prayasyougo" viewBox="0 0 32 32"><path d="M8 23c2-6 5-9 8-9s6 3 8 9" fill="none" stroke="#7DB9E8" stroke-width="2.1" stroke-linecap="round"/><path d="M12 14c-1-4 1-7 4-7s5 3 4 7" fill="#FF8126"/><path d="M10 25h12" stroke="#45DB70" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="biologos" viewBox="0 0 32 32"><circle cx="16" cy="16" r="4" fill="#45DB70"/><path d="M16 3c5 5 5 21 0 26M3 16c5-5 21-5 26 0M7 7c7 1 17 11 18 18M25 7C18 8 8 18 7 25" fill="none" stroke="#7DB9E8" stroke-width="1.5"/><circle cx="16" cy="16" r="11" fill="none" stroke="#FF8126" stroke-width="1.4"/></symbol>
  <symbol id="bibleodyssey" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#0F2B45" stroke="#7DB9E8" stroke-width="1.6"/><path d="M8 19c4-4 8-6 16-7" fill="none" stroke="#FF8126" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="20" r="2.5" fill="#45DB70"/><circle cx="22" cy="11" r="2.5" fill="#F3F7FB"/><path d="M16 5v4M5 16h4M23 23l3 3" stroke="#7DB9E8" stroke-width="1.5" stroke-linecap="round"/></symbol>
'''
              svg = svg.replace('</svg>', icons + '\n</svg>')
              sprite.write_text(svg)
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-dashboard.js assets/quick-links-extra.svg
          git diff --cached --quiet || git commit -m "Add Faith quick links"
          git push
