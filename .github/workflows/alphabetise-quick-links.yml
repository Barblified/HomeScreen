name: Alphabetise quick links
on:
  push:
    paths:
      - '.github/workflows/alphabetise-quick-links.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort categories and links at render time
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/home-dashboard.js')
          text = path.read_text()
          old = """    categories.forEach(category => {"""
          new = """    [...categories]\n      .sort((a, b) => a.name.localeCompare(b.name, 'en-GB', { sensitivity: 'base' }))\n      .forEach(category => {"""
          if old not in text:
              raise SystemExit('Category render loop not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home-dashboard.js
          git diff --cached --quiet || git commit -m "Alphabetise quick-link categories"
          git push
