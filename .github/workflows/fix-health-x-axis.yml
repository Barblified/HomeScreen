name: Fix health chart x axes
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix-health-x-axis.py
      - run: |
          rm .github/workflows/fix-health-x-axis.yml .github/scripts/fix-health-x-axis.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ignore blank dates on health chart x axes"
          git push
