name: Apply HomeScreen design system
on:
  push:
    paths:
      - '.github/workflows/apply-design-system.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography and chart readability system
        run: |
          python - <<'PY'
          from pathlib import Path

          html_links = {
              Path('index.html'): 'assets/type-system.css',
              Path('home-content.html'): 'assets/type-system.css',
              Path('health/index.html'): '../assets/type-system.css',
              Path('health/content.html'): '../assets/type-system.css',
              Path('learn/index.html'): '../assets/type-system.css',
              Path('learn/v2.html'): '../assets/type-system.css',
              Path('learn/content.html'): '../assets/type-system.css',
          }

          for path, href in html_links.items():
              if not path.exists():
                  continue
              text = path.read_text()
              if 'type-system.css' not in text:
                  marker = '</head>'
                  if marker not in text:
                      raise SystemExit(f'{path}: </head> not found')
                  text = text.replace(marker, f'  <link rel="stylesheet" href="{href}">\n{marker}', 1)
                  path.write_text(text)

          for path in [Path('assets/home-weight-chart.js'), Path('assets/health-weight-chart.js')]:
              text = path.read_text()

              old_font = 'context.font = `${compact ? 10 : 11}px \\"Gloria Hallelujah\\", cursive`;'
              new_font = 'context.font = `${compact ? 13 : 14}px \\"Atkinson Hyperlegible\\", Arial, sans-serif`;'
              if old_font not in text:
                  raise SystemExit(f'{path}: chart font declaration not found')
              text = text.replace(old_font, new_font, 1)

              old_sig = 'function drawSeries(series, valueKey, strokeStyle, lineWidth) {'
              new_sig = 'function drawSeries(series, valueKey, strokeStyle, lineWidth, lineDash = []) {'
              if old_sig not in text:
                  raise SystemExit(f'{path}: drawSeries signature not found')
              text = text.replace(old_sig, new_sig, 1)

              function_start = text.index(new_sig)
              dash_pos = text.index('context.setLineDash([]);', function_start)
              text = text[:dash_pos] + 'context.setLineDash(lineDash);' + text[dash_pos + len('context.setLineDash([]);'):]

              stroke_marker = 'context.stroke();\n    }\n\n    drawSeries(linearTrendSeries'
              if stroke_marker not in text:
                  raise SystemExit(f'{path}: drawSeries end marker not found')
              text = text.replace(
                  stroke_marker,
                  'context.stroke();\n      context.setLineDash([]);\n    }\n\n    drawSeries(linearTrendSeries',
                  1,
              )

              old_linear = "drawSeries(linearTrendSeries, 'trendKg', '#7DB9E8', 2);"
              if old_linear not in text:
                  raise SystemExit(f'{path}: linear trend call not found')
              text = text.replace(old_linear, "drawSeries(linearTrendSeries, 'trendKg', '#7DB9E8', 2.25, [7, 5]);", 1)

              text = text.replace("'#FF8126', 3", "'#FFAD62', 3")
              text = text.replace("rgba(190,214,235,.12)", "rgba(182,201,219,.18)")
              text = text.replace("rgba(190, 214, 235, 0.12)", "rgba(182, 201, 219, 0.18)")
              text = text.replace("'#B6C9DB'", "'#D7E3ED'")

              if path.name == 'health-weight-chart.js':
                  old_point = "context.fillStyle = '#7DB9E8';\n      context.fill();"
                  if old_point not in text:
                      raise SystemExit(f'{path}: health point style not found')
                  text = text.replace(old_point, "context.fillStyle = '#F3F7FB';\n      context.fill();", 1)

              path.write_text(text)
          PY
          node --check assets/home-weight-chart.js
          node --check assets/health-weight-chart.js
      - name: Commit design system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home-content.html health/index.html health/content.html learn/index.html learn/v2.html learn/content.html assets/home-weight-chart.js assets/health-weight-chart.js
          git diff --cached --quiet || git commit -m "Apply accessible typography and chart palette"
          git push
