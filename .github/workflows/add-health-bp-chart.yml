name: Add Health BP Chart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-health-bp-chart.yml'

permissions:
  contents: write

jobs:
  install-bp-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add blood pressure chart script to health page
        shell: python
        run: |
          from pathlib import Path

          path = Path('health/index.html')
          text = path.read_text(encoding='utf-8')
          tag = '  <script src="/HomeScreen/assets/health-bp-chart.js"></script>\n'
          if 'health-bp-chart.js' not in text:
              if '</body>' not in text:
                  raise RuntimeError('No closing body tag found in health/index.html')
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit health page update
        run: |
          rm .github/workflows/add-health-bp-chart.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/index.html .github/workflows/add-health-bp-chart.yml
          git commit -m "Wire blood pressure chart into Health page"
          git push
