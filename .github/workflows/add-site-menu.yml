name: Add site navigation

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add menu to every page
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              Path("index.html"),
              Path("health/index.html"),
              Path("learn/index.html"),
          ]

          nav_css = r'''

    /* Shared site navigation */
    body {
      padding-top: 82px;
    }

    .site-menu {
      position: fixed;
      z-index: 1000;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 7px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(32, 40, 45, 0.94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(10px);
      font-family: system-ui, sans-serif;
      font-size: 16px;
      line-height: 1;
    }

    .site-menu a {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      white-space: nowrap;
    }

    .site-menu a:hover,
    .site-menu a:focus-visible {
      background: rgba(255, 255, 255, 0.16);
    }

    @media (max-width: 480px) {
      body {
        padding-top: 76px;
      }

      .site-menu {
        font-size: 14px;
      }

      .site-menu a {
        padding: 8px 11px;
      }
    }
'''

          nav_html = r'''
  <nav class="site-menu" aria-label="Site navigation">
    <a href="https://barblified.github.io/HomeScreen/">Home</a>
    <a href="https://barblified.github.io/HomeScreen/health/">Health</a>
    <a href="https://barblified.github.io/HomeScreen/learn/">Learn</a>
  </nav>
'''

          for page in pages:
              html = page.read_text(encoding="utf-8")
              if "class=\"site-menu\"" in html:
                  continue
              html = html.replace("</style>", nav_css + "  </style>", 1)
              html, replacements = re.subn(
                  r"(<body[^>]*>)",
                  lambda match: match.group(1) + "\n" + nav_html,
                  html,
                  count=1,
                  flags=re.IGNORECASE,
              )
              if replacements != 1:
                  raise RuntimeError(f"No body tag found in {page}")
              page.write_text(html, encoding="utf-8")

      - name: Commit updated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html health/index.html learn/index.html
          git rm .github/workflows/add-site-menu.yml
          git commit -m "Add navigation menu to all site pages"
          git push origin main
