name: Fix health coach text parser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-health-text-parser.yml'

permissions:
  contents: write

jobs:
  fix-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch sentence parser and bump content cache
        shell: python
        run: |
          from pathlib import Path

          content_path = Path('health/content.html')
          text = content_path.read_text(encoding='utf-8')

          old = '''    function splitReadableSentences(text) {
      const value = textOrBlank(text);
      if (!value) return [];
      const lines = value.split(/\\n+/).map(item => item.trim()).filter(Boolean);
      if (lines.length > 1) return lines;
      const sentences = value.match(/[^.!?]+(?:[.!?]+|$)/g) || [value];
      return sentences.map(item => item.trim()).filter(Boolean);
    }
'''

          new = '''    function splitReadableSentences(text) {
      const value = textOrBlank(text).replace(/\\s+/g, " ").trim();
      if (!value) return [];

      const abbreviations = [
        "et al.", "e.g.", "i.e.", "vs.", "dr.", "mr.", "mrs.", "ms.",
        "prof.", "fig.", "no.", "st.", "approx."
      ];
      const sentences = [];
      let start = 0;

      for (let i = 0; i < value.length; i += 1) {
        const char = value[i];
        if (!".!?".includes(char)) continue;

        const previous = value[i - 1] || "";
        const next = value[i + 1] || "";

        // Decimal values such as 134.5/72.5, 111.6 kg and 7.5 h are not sentence breaks.
        if (char === "." && /\\d/.test(previous) && /\\d/.test(next)) continue;

        const prefix = value.slice(Math.max(0, i - 12), i + 1).toLowerCase();
        if (abbreviations.some(abbreviation => prefix.endsWith(abbreviation))) continue;

        let nextIndex = i + 1;
        while (nextIndex < value.length && /\\s/.test(value[nextIndex])) nextIndex += 1;
        const nextVisible = value[nextIndex] || "";

        if (nextVisible && /[,;:)}\\]]/.test(nextVisible)) continue;
        if (nextVisible && !/[A-Z0-9]/.test(nextVisible)) continue;

        const sentence = value.slice(start, i + 1).trim();
        if (sentence) sentences.push(sentence);
        start = i + 1;
      }

      const remainder = value.slice(start).trim();
      if (remainder) sentences.push(remainder);
      return sentences;
    }
'''

          if old not in text:
              raise SystemExit('Expected splitReadableSentences block not found')
          content_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          index_path = Path('health/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_cache = 'content.html?v=20260916-1145'
          new_cache = 'content.html?v=20260917-1155'
          if old_cache not in index:
              raise SystemExit('Expected health content cache token not found')
          index_path.write_text(index.replace(old_cache, new_cache, 1), encoding='utf-8')

      - name: Regression test decimal and BP parsing
        shell: node
        run: |
          node <<'NODE'
          function textOrBlank(value) {
            return value === null || value === undefined ? '' : String(value).trim();
          }

          function splitReadableSentences(text) {
            const value = textOrBlank(text).replace(/\s+/g, " ").trim();
            if (!value) return [];
            const abbreviations = [
              "et al.", "e.g.", "i.e.", "vs.", "dr.", "mr.", "mrs.", "ms.",
              "prof.", "fig.", "no.", "st.", "approx."
            ];
            const sentences = [];
            let start = 0;
            for (let i = 0; i < value.length; i += 1) {
              const char = value[i];
              if (!".!?".includes(char)) continue;
              const previous = value[i - 1] || "";
              const next = value[i + 1] || "";
              if (char === "." && /\d/.test(previous) && /\d/.test(next)) continue;
              const prefix = value.slice(Math.max(0, i - 12), i + 1).toLowerCase();
              if (abbreviations.some(abbreviation => prefix.endsWith(abbreviation))) continue;
              let nextIndex = i + 1;
              while (nextIndex < value.length && /\s/.test(value[nextIndex])) nextIndex += 1;
              const nextVisible = value[nextIndex] || "";
              if (nextVisible && /[,;:)}\]]/.test(nextVisible)) continue;
              if (nextVisible && !/[A-Z0-9]/.test(nextVisible)) continue;
              const sentence = value.slice(start, i + 1).trim();
              if (sentence) sentences.push(sentence);
              start = i + 1;
            }
            const remainder = value.slice(start).trim();
            if (remainder) sentences.push(remainder);
            return sentences;
          }

          const sample = `Morning observations: weight 111.6 kg, waist 116.5 cm, sleep 7 h, BP 154/57, and a 100-minute purposeful walk are recorded. Yesterday closed at 2,106 kcal, 92 g protein and 12 g fibre. Today is unfinished, so no nutrition adherence judgement is made. The 28-day BP average is 134.5/72.5; today’s reading is retained as trend data only and is not diagnostic. NICE advises that hypertension diagnosis and confirmation use repeated measurements rather than a single reading (NICE NG136).`;
          const result = splitReadableSentences(sample);
          console.log(result);
          if (result.length !== 5) throw new Error(`Expected 5 bullets, got ${result.length}`);
          if (!result[3].includes('134.5/72.5;')) throw new Error('BP decimal value was split');
          if (result.some(item => item === '5/72.' || item === '5;')) throw new Error('Parser fragment regression detected');
          console.log('Parser regression test: PASS');
          NODE

      - name: Remove installer workflow and commit
        run: |
          rm .github/workflows/fix-health-text-parser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix health coach sentence parsing"
          git push
