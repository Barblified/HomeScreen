name: Math audit fix
on:
  push:
    paths:
      - '.github/workflows/math-audit-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited maths fixes
        run: echo '' | base64 -d | python
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/content.html assets/health-weight-chart.js
          git diff --cached --quiet || git commit -m "Fix health maths and conversion edge cases"
          git push
