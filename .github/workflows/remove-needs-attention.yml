name: Remove Needs Attention from HomeScreen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-needs-attention.yml'

permissions:
  contents: write

jobs:
  remove-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Needs Attention card
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('home-content.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'\n\s*<article class="card" aria-labelledby="attention-heading">.*?</article>'
          updated, count = re.subn(pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError(f'Expected one Needs Attention article, removed {count}')
          grid_pattern = r'(\.dashboard-grid\s*\{\s*)grid-template-columns:\s*minmax\(0,\s*1\.55fr\)\s+minmax\(390px,\s*1fr\);'
          updated, grid_count = re.subn(grid_pattern, r'\1grid-template-columns: minmax(0, 1fr);', updated, count=1)
          if grid_count != 1:
              raise RuntimeError(f'Expected one dashboard grid definition, changed {grid_count}')
          updated = updated.replace('aria-label="Live dashboard"', 'aria-label="Pinned favourites"', 1)
          path.write_text(updated, encoding='utf-8')

      - name: Commit removal
        run: |
          rm .github/workflows/remove-needs-attention.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-content.html .github/workflows/remove-needs-attention.yml
          git commit -m "Remove Needs Attention from homepage"
          git push