name: Patch waist chart live refresh

on:
  push:
    paths:
      - '.github/workflows/patch-waist-autorefresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add automatic waist refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/health-waist-chart.js')
          text = path.read_text(encoding='utf-8')

          old = '''      injectChart(doc);\n      loadHistory(doc);\n\n      let resizeFrame;\n      doc.defaultView?.addEventListener('resize', () => {\n        doc.defaultView.cancelAnimationFrame(resizeFrame);\n        resizeFrame = doc.defaultView.requestAnimationFrame(() => {\n          if (currentHistory.length) drawChart(doc, currentHistory);\n        });\n      });'''

          new = '''      injectChart(doc);\n      loadHistory(doc);\n\n      const view = doc.defaultView;\n      if (view && !view.__waistChartLiveRefreshInstalled) {\n        view.__waistChartLiveRefreshInstalled = true;\n\n        const refreshLiveData = () => {\n          if (doc.visibilityState !== 'hidden') loadHistory(doc);\n        };\n\n        view.setInterval(refreshLiveData, 60000);\n        view.addEventListener('focus', refreshLiveData);\n        doc.addEventListener('visibilitychange', () => {\n          if (doc.visibilityState === 'visible') refreshLiveData();\n        });\n      }\n\n      let resizeFrame;\n      doc.defaultView?.addEventListener('resize', () => {\n        doc.defaultView.cancelAnimationFrame(resizeFrame);\n        resizeFrame = doc.defaultView.requestAnimationFrame(() => {\n          if (currentHistory.length) drawChart(doc, currentHistory);\n        });\n      });'''

          if old not in text:
              raise SystemExit('Expected waist chart initialise block was not found; refusing unsafe patch.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove installer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/health-waist-chart.js
          git rm .github/workflows/patch-waist-autorefresh.yml
          git commit -m 'Refresh waist chart automatically'
          git push