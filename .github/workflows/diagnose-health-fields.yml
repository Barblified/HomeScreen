name: Diagnose health fields

on:
  push:
    paths:
      - '.github/workflows/diagnose-health-fields.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect rendered health page
        run: |
          python -m pip install selenium --quiet
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          import time, json

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1400,3000')

          driver = webdriver.Chrome(options=opts)
          try:
              driver.get('https://barblified.github.io/HomeScreen/health/?diag=20260915')
              time.sleep(8)
              frame = driver.find_element(By.CSS_SELECTOR, 'iframe.page-frame')
              driver.switch_to.frame(frame)

              ids = [
                  'status','lost','lost-imperial','weight-line','bmi','checkpoint-label','checkpoint-percent',
                  'calories-today','protein-grams-today','carbs-grams-today','fat-grams-today',
                  'logged','protein','workouts','sleep','coach-status','risk-flag','recommended-action',
                  'daily-analysis','trend-summary','missing-fields','evidence-source','updated','source',
                  'weight-trend-current','weight-trend-seven','weight-trend-fourteen',
                  'bp-trend-latest','bp-trend-average','bp-trend-count',
                  'waist-trend-latest','waist-trend-seven','waist-trend-fourteen','waist-trend-count'
              ]
              out = {}
              for id_ in ids:
                  els = driver.find_elements(By.ID, id_)
                  out[id_] = els[0].text if els else '<missing element>'
              print('--- FIELDS ---')
              print(json.dumps(out, indent=2, ensure_ascii=False))
              print('--- CONSOLE ---')
              try:
                  for row in driver.get_log('browser'):
                      print(row)
              except Exception as e:
                  print('console unavailable', e)
          finally:
              driver.quit()
          PY
