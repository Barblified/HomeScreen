name: Fix health field mapping

on:
  push:
    paths:
      - '.github/workflows/fix-health-field-mapping.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch health display mappings
        run: python .github/scripts/fix_health_field_mapping.py
      - name: Commit changes and remove temporary files
        run: |
          rm .github/workflows/fix-health-field-mapping.yml
          rm .github/scripts/fix_health_field_mapping.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/content.html health/index.html .github/workflows/fix-health-field-mapping.yml .github/scripts/fix_health_field_mapping.py
          git commit -m "Fix health field mappings"
          git push
