name: Fix health text parser v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-health-text-parser-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        shell: python
        run: |
          from pathlib import Path
          p = Path('health/content.html')
          s = p.read_text(encoding='utf-8')
          old = '''    function splitReadableSentences(text) {
      const value = textOrBlank(text);
      if (!value) return [];
      const lines = value.split(/\\n+/).map(item => item.trim()).filter(Boolean);
      if (lines.length > 1) return lines;
      const sentences = value.match(/[^.!?]+(?:[.!?]+|$)/g) || [value];
      return sentences.map(item => item.trim()).filter(Boolean);
    }
'''
          new = '''    function splitReadableSentences(text) {
      const value = textOrBlank(text).replace(/\\s+/g, " ").trim();
      if (!value) return [];
      const abbreviations = ["et al.", "e.g.", "i.e.", "vs.", "dr.", "mr.", "mrs.", "ms.", "prof.", "fig.", "no.", "st.", "approx."];
      const sentences = [];
      let start = 0;
      for (let i = 0; i < value.length; i += 1) {
        const char = value[i];
        if (!".!?".includes(char)) continue;
        const previous = value[i - 1] || "";
        const next = value[i + 1] || "";
        if (char === "." && /\\d/.test(previous) && /\\d/.test(next)) continue;
        const prefix = value.slice(Math.max(0, i - 12), i + 1).toLowerCase();
        if (abbreviations.some(abbreviation => prefix.endsWith(abbreviation))) continue;
        let nextIndex = i + 1;
        while (nextIndex < value.length && /\\s/.test(value[nextIndex])) nextIndex += 1;
        const nextVisible = value[nextIndex] || "";
        if (nextVisible && /[,;:)}\\]]/.test(nextVisible)) continue;
        if (nextVisible && !/[A-Z0-9]/.test(nextVisible)) continue;
        const sentence = value.slice(start, i + 1).trim();
        if (sentence) sentences.push(sentence);
        start = i + 1;
      }
      const remainder = value.slice(start).trim();
      if (remainder) sentences.push(remainder);
      return sentences;
    }
'''
          if old not in s:
              raise SystemExit('parser block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          i = Path('health/index.html')
          x = i.read_text(encoding='utf-8')
          x = x.replace('content.html?v=20260916-1145', 'content.html?v=20260917-1155', 1)
          i.write_text(x, encoding='utf-8')
      - name: Regression test
        shell: bash
        run: |
          node - <<'NODE'
          function split(text) {
            const value = String(text || '').replace(/\s+/g, ' ').trim();
            const abbreviations = ['et al.','e.g.','i.e.','vs.','dr.','mr.','mrs.','ms.','prof.','fig.','no.','st.','approx.'];
            const sentences=[]; let start=0;
            for (let i=0;i<value.length;i++) {
              const char=value[i]; if (!'.!?'.includes(char)) continue;
              const previous=value[i-1]||'', next=value[i+1]||'';
              if (char==='.' && /\d/.test(previous) && /\d/.test(next)) continue;
              const prefix=value.slice(Math.max(0,i-12),i+1).toLowerCase();
              if (abbreviations.some(a=>prefix.endsWith(a))) continue;
              let j=i+1; while (j<value.length && /\s/.test(value[j])) j++;
              const nv=value[j]||'';
              if (nv && /[,;:)}\]]/.test(nv)) continue;
              if (nv && !/[A-Z0-9]/.test(nv)) continue;
              const sentence=value.slice(start,i+1).trim(); if (sentence) sentences.push(sentence); start=i+1;
            }
            const rest=value.slice(start).trim(); if(rest) sentences.push(rest); return sentences;
          }
          const sample=`Morning observations: weight 111.6 kg, waist 116.5 cm, sleep 7 h, BP 154/57, and a 100-minute purposeful walk are recorded. Yesterday closed at 2,106 kcal, 92 g protein and 12 g fibre. Today is unfinished, so no nutrition adherence judgement is made. The 28-day BP average is 134.5/72.5; today’s reading is retained as trend data only and is not diagnostic. NICE advises that hypertension diagnosis and confirmation use repeated measurements rather than a single reading (NICE NG136).`;
          const out=split(sample); console.log(out);
          if(out.length!==5) throw new Error(`expected 5 bullets, got ${out.length}`);
          if(!out[3].includes('134.5/72.5;')) throw new Error('BP decimal split');
          console.log('PASS');
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/content.html health/index.html
          git commit -m "Fix health coach sentence parsing"
          git push
