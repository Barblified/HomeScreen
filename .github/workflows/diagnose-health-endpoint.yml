name: Diagnose health endpoint

on:
  push:
    paths:
      - '.github/workflows/diagnose-health-endpoint.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoint
        run: |
          set -o pipefail
          url='https://script.google.com/macros/s/AKfycbwihWQw8Frs1acA1Y-CELBw0NmX4O5KFzcqU3f8TbFpSegleKyPM64TkqTyoNyAWhLP/exec'
          echo '--- HEADERS + BODY START ---'
          curl -L -sS -D /tmp/headers.txt -o /tmp/body.txt "$url"
          cat /tmp/headers.txt
          echo '--- BODY PREVIEW ---'
          head -c 2000 /tmp/body.txt
          echo
          echo '--- BODY SIZE ---'
          wc -c /tmp/body.txt
