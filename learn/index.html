<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn Something New</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #FFF9F1; font-family: "Swanky and Moo Moo", cursive; }
    .site-menu {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      background: #FFF9F1;
      border-bottom: 1px solid rgba(35,64,61,.14);
      box-shadow: 0 4px 14px rgba(35,64,61,.10);
    }
    .site-menu a {
      padding: 8px 17px;
      border-radius: 999px;
      color: #23403D;
      text-decoration: none;
      font-size: 1.35rem;
      line-height: 1;
    }
    .site-menu a:hover,
    .site-menu a:focus-visible { background: #EAF7FA; }
    .site-menu a[aria-current="page"] { background: #FF8A3D; color: #23403D; }
    .page-frame { width: 100%; height: calc(100% - 62px); border: 0; display: block; background: #FFF9F1; }
    @media (max-width: 480px) {
      .site-menu { height: 56px; gap: 4px; padding: 7px 8px; }
      .site-menu a { padding: 7px 12px; font-size: 1.18rem; }
      .page-frame { height: calc(100% - 56px); }
    }
  </style>
</head>
<body>
  <nav class="site-menu" aria-label="Site navigation">
    <a href="/HomeScreen/">Home</a>
    <a href="/HomeScreen/health/">Health</a>
    <a href="/HomeScreen/learn/" aria-current="page">Learn</a>
  </nav>
  <iframe class="page-frame" src="v2.html" title="Learn Something New page" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</body>
</html>
